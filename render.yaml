services:
  - type: web
    name: smartbin-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartbin-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend:.
      - key: API_KEY
        value: smartbin_secret_key_2026
      - key: ENABLE_POLLER
        value: "false"

databases:
  - name: smartbin-postgres
    plan: free
    databaseName: smartbindb
    user: smartbin
