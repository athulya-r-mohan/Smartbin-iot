version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: smartbin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbin123}
      POSTGRES_DB: ${POSTGRES_DB:-smartbindb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbin} -d ${POSTGRES_DB:-smartbindb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbin_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartbin}:${POSTGRES_PASSWORD:-smartbin123}@postgres:5432/${POSTGRES_DB:-smartbindb}
      - ESP32_IP=${ESP32_IP:-192.168.1.100}
      - ESP32_PORT=${ESP32_PORT:-80}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-2.0}
      - DANGER_THRESHOLD=80
      - FULL_THRESHOLD=75
      - MEDIUM_THRESHOLD=50
    ports:
      - "8000:8000"

volumes:
  postgres_data:

